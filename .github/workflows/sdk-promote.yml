name: Promote to production

# Phase three of the SDK promotion pipeline: every push to this staging
# repo's main rolls into a single sync branch + PR on the production repo.
# A human merges that PR to release; release-please on the production repo
# then opens its version PR and the publish workflow ships the release.
#
# The sync branch is built as production/main plus ONE commit whose tree is
# exactly staging main (not staging's commit history). That keeps the PR
# diff equal to "what changes in production" and — because no shared
# history is required — survives squash merges: the old approach of
# pushing staging's raw history conflicted on the next sync after any
# squash-merged promotion. The branch is force-updated on every push (it
# is derived state), so one rolling PR stays current until it is merged.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-promote
  cancel-in-progress: true

env:
  PRODUCTION_REPO: cadenya/cadenya-typescript
  SYNC_BRANCH: staging-sync

jobs:
  promote:
    # Guard against this file running after it syncs into the production repo.
    if: github.repository == 'cadenya/cadenya-typescript-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tree-sync commit and open the rolling PR
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::PRODUCTION_REPO_TOKEN is not configured on this repo — skipping promotion."
            exit 0
          fi
          git config user.name "diddlysquat-promote"
          git config user.email "diddlysquat-promote@users.noreply.github.com"
          git remote add production "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git -c "http.https://github.com/.extraheader=" fetch production main

          if git diff --quiet production/main origin/main; then
            echo "Production already matches staging's tree — nothing to promote."
            exit 0
          fi

          # production/main + one commit carrying staging's exact tree.
          git checkout --detach production/main
          git read-tree -u --reset origin/main
          staging_sha=$(git rev-parse --short origin/main)
          {
            echo "Sync from staging @${staging_sha}"
            echo ""
            echo "Tree-sync of ${{ github.repository }} main. Recent staging commits:"
            git log --oneline -15 origin/main | sed 's/^/  /'
          } > /tmp/sync-msg
          git commit -qF /tmp/sync-msg
          git -c "http.https://github.com/.extraheader=" push --force production "HEAD:refs/heads/${SYNC_BRANCH}"

          existing=$(gh pr list --repo "$PRODUCTION_REPO" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ]; then
            echo "Rolling sync PR #$existing already open — branch rebuilt."
          else
            gh pr create --repo "$PRODUCTION_REPO" --base main --head "$SYNC_BRANCH" \
              --title "Sync from staging" \
              --body "Rolling sync of \`${{ github.repository }}\` main into production, rebuilt on every staging push as a single tree-sync commit on top of production main (safe to squash-merge). Merging releases the accumulated changes; release-please opens the version PR next."
          fi
